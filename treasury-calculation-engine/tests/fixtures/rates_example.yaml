    - [rates:deposit:USD:2, 2027-04-01, 2027-01-01, 90, "-0.25", "-0.3125"]
    - [rates:deposit:USD:2, 2027-07-01, 2027-04-01, 91, "-0.75", "-0.9479"]
    - [rates:deposit:USD:2, 2027-10-01, 2027-07-01, 92, "-1.00", "-1.2778"]
    - [rates:deposit:USD:3, 2027-05-01, 2027-02-01, 89, "-0.50", "-0.6181"]
    - [rates:deposit:USD:3, 2027-08-01, 2027-05-01, 92, "-1.00", "-1.2778"]
